name: Update Critical Care News Feed

on:
  schedule:
    # Every 72 hours: 06:00 UTC on Mon, Thu, Sun
    - cron: "0 6 * * 1,4,0"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news
        run: python3 fetch_news.py

      - name: Commit and push feed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update news feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
